  blob-size-guard:
    name: No large files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fail if any changed file exceeds 10 MB
        # Guardrail: build trees and other agent-workspace artifacts must never
        # land in git history again (target-test-codex/ alone added ~1.3 GB).
        # Installers under /installers are an intentional exception handled by
        # their own release process, but they stay under this limit per file.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.sha }}
        run: |
          base="$PR_BASE_SHA"
          head="$PR_HEAD_SHA"
          oversized=$(git diff --name-only "$base" "$head" -z |
            while IFS= read -r -d '' file; do
              if git cat-file -e "$head:$file" 2>/dev/null; then
                size=$(git cat-file -s "$head:$file")
                if [ "$size" -gt 10485760 ]; then
                  echo "$file ($(( size / 1048576 )) MB)"
                fi
              fi
            done)
          if [ -n "$oversized" ]; then
            echo "Files exceeding the 10 MB limit:"
            echo "$oversized"
            exit 1
          fi
          echo "No changed file exceeds 10 MB."

