[package]
name = "verenu"
version = "0.15.1"
description = "Verenu — local-first AI dictation"
authors = ["Verenu Team"]
edition = "2021"

[[bin]]
name = "verenu"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "macos-private-api"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-shell       = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls", "charset"] }
bytes       = "1"
cpal        = "0.15"
rodio       = { version = "0.20", default-features = false }
hound       = "3.5"
nnnoiseless = "0.4"
base64      = "0.22"
anyhow      = "1"
log         = "0.4"
chrono      = { version = "0.4", features = ["serde"] }
crossbeam-queue = "0.3"
flate2      = "1"
futures-util = "0.3"
sha2        = "0.10"
tar         = "0.4"
zip         = { version = "2", default-features = false, features = ["deflate"] }
transcribe-rs = { version = "0.3.11", features = ["onnx"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Media_Control",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_Storage_FileSystem",
  "Win32_Security_Credentials",
  "Win32_Networking_NetworkListManager",
  "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey      = "0.8"    # Carbon RegisterEventHotKey global hotkey (no Input Monitoring / Accessibility needed)
core-graphics      = "0.24"   # CGEvent post (Cmd+V), Caps-Lock state
core-foundation    = "0.10"   # CFRunLoop, CFString, CFRunLoopSource
objc2              = "0.5"     # msg_send! for AppKit (NSWorkspace, NSPasteboard)
objc2-foundation   = { version = "0.2", features = ["NSData", "NSString"] }  # NSData/NSString conversions
block2             = "0.5"     # ObjC completion blocks (AVCaptureDevice mic request)
accessibility-sys  = "0.1"     # AXUIElement (auto-learn focused text + AX prompt)
libproc            = "0.14"    # process RSS for memory monitor
libc               = "0.2"     # statvfs (free disk space)
security-framework = "2"       # macOS Keychain generic-password storage
coreaudio          = { package = "coreaudio-rs", version = "0.11" }  # CoreAudio native mute control

[profile.release]
opt-level  = "s"
lto        = true
strip      = true
panic      = "abort"
codegen-units = 1
